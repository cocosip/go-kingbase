version: "2"

run:
  timeout: 10m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - goconst
    - gocyclo

  settings:
    goconst:
      # Wire-format type names (bool, int4, bytea, ...) recur in codec tables
      # by design; only hoist values repeated five or more times.
      min-occurrences: 6
